name: Android APK

# Arena AI (fan-made) Android istemcisi için debug APK üretir.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub Release de oluşturulsun mu'
        type: boolean
        default: false

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
            sdkmanager --list_installed 2>/dev/null | head -40 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Gradle sarmalayıcısını hazırla
        working-directory: android
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: assembleDebug
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Derleme günlüğünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: arena-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release (opsiyonel)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: "Arena AI (fan) v${{ github.run_number }}"
          body: |
            Fan-made Arena AI Android istemcisi — otomatik derleme.
            Kurulum: APK'yı indir, telefonda "Bilinmeyen kaynak" iznini ver, kur.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
